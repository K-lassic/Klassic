# Compose 설정이 병합되는지 PR 마다 확인한다 — 기본 · demo 구성 (#95 CI 자동화 · 담당: 팀장)
#
#   구조에서의 위치: GitHub 가 PR 을 열거나 고칠 때 · main 에 병합될 때 실행. 컨테이너를 띄우지 않는다 — 설정만 읽는다.
#   무엇을 보나: `docker compose config` 가 오류 없이 끝나는가.
#     api/compose.yaml 은 서비스 폴더의 compose.yaml 을 include 만 한다 (CLAUDE.md 「이 저장소에서 정한 것」).
#     각자 자기 폴더의 compose.yaml 을 고치므로, 합쳤을 때 서비스 이름 · 볼륨 · 네트워크가 부딪히는지는 합쳐 봐야 안다.
#       기본  api/compose.yaml
#       demo  기본 + --profile demo
#   .env 는 저장소의 api/.env.example 로 만든다. 값이 빈 칸(비밀값 자리)만 자리 표시 값으로 채운다.
#     필수 키가 예시에서 아예 빠지면 여기서 걸린다 (compose 가 `${KEY:?…}` 로 요구하는 키인데 .env.example 에 없는 경우
#     — 구축 문서대로 따라 하면 막히는 상황). 채우는 값은 자리 표시용이다 — 비밀값이 아니다.
#   여기서 하지 않는 것: 이미지 빌드 · 컨테이너 기동 · healthcheck. 엔진 볼륨과 음원(LFS)이 필요해 러너에서는 못 한다.
name: compose 설정 확인

on:
  pull_request:
    paths:
      - 'api/compose.yaml'
      - 'api/**/compose*.yaml'
      - 'api/.env.example'
      - 'api/deploy/*.env'
      - '.github/workflows/compose.yml'
  push:
    branches: [main]
    paths:
      - 'api/compose.yaml'
      - 'api/**/compose*.yaml'
      - 'api/.env.example'
      - 'api/deploy/*.env'
      - '.github/workflows/compose.yml'

permissions:
  contents: read

concurrency:
  group: compose-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  config:
    name: docker compose config (기본 · 대역 · demo)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: api
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Compose 판 확인
        run: docker compose version

      # 예시 파일의 비밀값 칸은 비어 있다 (`DB_PASSWORD=` · `SESSION_SECRET=   # 32자 이상`). 빈 칸만 자리 표시 값으로 채운다.
      # 키 자체가 예시에 없으면 채워지지 않으므로, compose 가 요구하는 키가 예시에서 빠진 경우는 그대로 걸린다.
      - name: .env 준비 (예시 파일 + 빈 칸은 자리 표시 값)
        run: |
          sed -E 's/^([A-Za-z_][A-Za-z0-9_]*)=[[:space:]]*(#.*)?$/\1=ci-placeholder-not-a-secret/' .env.example > .env
          echo "자리 표시 값으로 채운 키: $(grep -c 'ci-placeholder-not-a-secret' .env)개"
          grep 'ci-placeholder-not-a-secret' .env | cut -d= -f1

      - name: 기본 구성
        run: docker compose -f compose.yaml config --quiet

      - name: demo 프로필
        run: docker compose -f compose.yaml --profile demo config --quiet

      # 사람이 읽을 요약 — 합쳐진 서비스 이름 (실행 화면의 Summary 에 보인다)
      - name: 병합 결과 요약
        run: |
          {
            echo "### 합쳐진 서비스 (기본 + demo 프로필)"
            docker compose -f compose.yaml --profile demo config --services | sort | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
