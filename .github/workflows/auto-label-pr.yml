# PR 제목과 변경 경로로 라벨을 자동으로 단다 (#95 CI 자동화, 담당: 팀장)
#
#   구조에서의 위치: GitHub 가 PR 을 열거나 바꿀 때 실행 → 기본 브랜치의 .github/scripts/auto-label-pr.cjs → gh api 로 PR 라벨만 더한다. 서비스 · 이미지와는 관계없다.
#   무엇을 다나: 유형(feat→enhancement 등) · 영역(area:*) · 우선순위(제목 · 본문에 연결한 이슈의 P1~P3) · contract(api/contracts/*.yaml 변경).
#     이미 붙은 라벨은 떼지 않고, 종류마다 하나도 없을 때만 더한다 → 사람이 붙인 라벨이 우선하고, 제목을 고쳐도 먼저 붙은 라벨은 그대로 둔다. 규칙 전체는 스크립트 머리말.
#   pull_request_target 을 쓰는 이유: 포크에서 온 PR 에도 라벨을 달 쓰기 권한이 필요하다 (auto-assign-pr.yml 과 같은 이유 · 같은 안전 규칙).
#     PR 의 코드를 받거나 실행하지 않는다 — 기본 브랜치의 .github/scripts 만 받는다(ref 를 기본 브랜치로 못 박음). PR 제목 · 본문은 환경변수에도 넣지 않고 번호만 넘긴다.
#   주의: pull_request_target 은 기본 브랜치에 있는 이 파일로 돈다. 이 파일을 고친 PR 에서는 바뀐 내용이 아니라 병합된 내용으로 실행된다.
name: PR 라벨 자동 지정

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize, ready_for_review]

# 필요한 권한만: 라벨 달기(pull-requests) · 연결한 이슈의 우선순위 읽기(issues) · 스크립트 받기(contents)
permissions:
  contents: read
  issues: read
  pull-requests: write

# 같은 PR 에서 연달아 실행되면 마지막 것만 — 라벨이 겹쳐 달리지 않게
concurrency:
  group: auto-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: 기본 브랜치의 스크립트만 받는다 (PR 코드 아님)
        # actions/checkout v4.2.2 — 태그가 아니라 커밋으로 고정한다 (쓰기 권한이 있는 job 이라 태그 이동에 대비)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: 제목 · 변경 경로로 라벨 지정
        run: node .github/scripts/auto-label-pr.cjs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
