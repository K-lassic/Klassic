      x-priority: P3
      parameters: [{ $ref: "#/components/parameters/AccountId" }]
      responses: { "200": { $ref: "#/components/responses/AdminObject" }, "409": { $ref: "#/components/responses/Error" } }
  /admin/accounts/{id}/enable:
    post:
