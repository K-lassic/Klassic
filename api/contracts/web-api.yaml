        - { name: status, in: query, schema: { enum: [active, locked, disabled] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses: { "200": { $ref: "#/components/responses/AdminObject" } }
  /admin/accounts/{id}:
    get:
      tags: [admin]
      summary: 계정 상세 (요청 20 · 키 · 변경 이력 · 인증 사건 20)
      security: [{ admin: [] }]
      x-priority: P3
      parameters: [{ $ref: "#/components/parameters/AccountId" }]
      responses: { "200": { $ref: "#/components/responses/AdminObject" }, "404": { $ref: "#/components/responses/Error" } }
  /admin/accounts/{id}/reveal-email:
    post:
      tags: [admin]
      summary: 전체 이메일 보기 (조회 이력 남김)
      security: [{ admin: [] }]
      x-priority: P3
      parameters: [{ $ref: "#/components/parameters/AccountId" }]
      responses: { "200": { $ref: "#/components/responses/AdminObject" } }
