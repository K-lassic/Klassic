      tags: [admin]
      summary: MP3 라이선스 확인 (G7 해제 기록)
      security: [{ admin: [] }]
      x-priority: P3
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [confirmed], properties: { confirmed: { type: boolean } } }
      responses: { "200": { $ref: "#/components/responses/AdminObject" } }

  # --- 처리 설정 · 모델 등록부 ---
  /admin/settings:
    get:
      tags: [admin]
      summary: 처리 설정 현재 판본 + 엔진 순서
      security: [{ admin: [] }]
      x-priority: P3
      responses: { "200": { $ref: "#/components/responses/AdminObject" } }
    put:
      tags: [admin]
      summary: 처리 설정 바꾸기 (바뀐 값만 → 새 판본 → model-api 다시 읽기)
      security: [{ admin: [] }]
      x-priority: P3
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { "200": { $ref: "#/components/responses/AdminObject" }, "400": { $ref: "#/components/responses/Error" } }
  /admin/models:
    get:
      tags: [admin]
      summary: 모델 등록부 + 실시간 상태
      security: [{ admin: [] }]
      x-priority: P3
      responses: { "200": { $ref: "#/components/responses/AdminObject" } }
    post:
      tags: [admin]
      summary: 모델 등록
      security: [{ admin: [] }]
      x-priority: P3
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { "201": { $ref: "#/components/responses/AdminObject" }, "422": { $ref: "#/components/responses/Error" } }
  /admin/models/ollama-available:
    get:
      tags: [admin]
      summary: Ollama 서버의 등록 가능 모델 (10GB 이하 · :cloud 아님)
      security: [{ admin: [] }]
      x-priority: P3
      responses: { "200": { $ref: "#/components/responses/AdminObject" } }
  /admin/models/{name}:
    parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
    put:
      tags: [admin]
      summary: 모델 바꾸기 (enabled · display_name · provider_ref · config)
      security: [{ admin: [] }]
      x-priority: P3
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { "200": { $ref: "#/components/responses/AdminObject" } }
    delete:
      tags: [admin]
      summary: 모델 등록 해제 (설정 순서에서 쓰는 중이면 422 MODEL_INVALID)
      security: [{ admin: [] }]
      x-priority: P3
      responses: { "204": { description: 해제됨 }, "422": { $ref: "#/components/responses/Error" } }
  /admin/models/{name}/load:
    post:
      tags: [admin]
      summary: 모델 불러오기(워밍업) 시작
      security: [{ admin: [] }]
      x-priority: P3
      parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
      responses: { "202": { $ref: "#/components/responses/AdminObject" } }

  # --- 운영 현황 · 작업 · 감사 · 평가 ---
  /admin/metrics:
    get:
      tags: [admin]
      summary: 운영 지표
      security: [{ admin: [] }]
      x-priority: P3
      responses: { "200": { $ref: "#/components/responses/AdminObject" } }
  /admin/jobs:
    get:
      tags: [admin]
      summary: 작업 목록
      security: [{ admin: [] }]
      x-priority: P3
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: channel, in: query, schema: { enum: [web, api] } }
        - { name: route, in: query, schema: { enum: [recognize, direct, fallback] } }
        - { name: reason, in: query, description: "대체 이유 (RequestStatus.fallback_reason 과 같은 대문자 코드)", schema: { type: string } }
        - { name: missing, in: query, description: "`1` 이면 기록이 빠진 요청만 (SC-004)", schema: { const: "1" } }
      responses: { "200": { $ref: "#/components/responses/AdminObject" } }
  /admin/jobs/{no}:
    get:
      tags: [admin]
      summary: 작업 상세 (엔진 시도 · 점검 항목 · 단계 시간)
      security: [{ admin: [] }]
      x-priority: P3
      parameters: [{ $ref: "#/components/parameters/RequestNo" }]
      responses: { "200": { $ref: "#/components/responses/AdminObject" }, "404": { $ref: "#/components/responses/Error" } }
  /admin/model-api-status:
    get:
      tags: [admin]
      summary: model-api 상태 · 버전
      security: [{ admin: [] }]
      x-priority: P3
      responses: { "200": { $ref: "#/components/responses/AdminObject" } }
  /admin/audit:
    get:
      tags: [admin]
      summary: 변경 이력 전체
      security: [{ admin: [] }]
      x-priority: P3
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
      responses: { "200": { $ref: "#/components/responses/AdminObject" } }
  /admin/evaluation:
    get:
      tags: [admin]
      summary: 평가 지표
      security: [{ admin: [] }]
      x-priority: P3
      responses: { "200": { $ref: "#/components/responses/AdminObject" } }
  /admin/evaluation/run:
    post:
      tags: [admin]
      summary: 평가 실행 시작
      security: [{ admin: [] }]
      x-priority: P3
      responses: { "202": { $ref: "#/components/responses/AdminObject" } }

  # --- 공유 악보 관리 (UC19) ---
  /admin/shared-scores:
    get:
      tags: [admin]
      summary: 공유 악보 목록
      security: [{ admin: [] }]
      x-priority: P3
      parameters:
        - { name: status, in: query, schema: { enum: [all, visible, taken_down, unshared, expired] } }
      responses: { "200": { $ref: "#/components/responses/AdminObject" } }
  /admin/shared-scores/{shareNo}/take-down:
    post:
      tags: [admin]
      summary: 공유 악보 내리기
      security: [{ admin: [] }]
      x-priority: P3
      parameters: [{ $ref: "#/components/parameters/ShareNo" }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { reason: { type: string } } }
      responses: { "200": { $ref: "#/components/responses/AdminObject" } }
  /admin/shared-scores/{shareNo}/restore:
    post:
      tags: [admin]
      summary: 내린 공유 악보 되살리기
      security: [{ admin: [] }]
      x-priority: P3
      parameters: [{ $ref: "#/components/parameters/ShareNo" }]
      responses: { "200": { $ref: "#/components/responses/AdminObject" } }

# =============================================================================
# 공통 구성 요소
# =============================================================================
components:
  securitySchemes:
    # 사용자 — 익명 세션 쿠키 (없으면 서버가 발급). 재구성 · 외부 공개에서는 Secure 속성 추가 (#5 C5)
    session:
      type: apiKey
      in: cookie
      name: gugak_sid
    # 운영자 — 관리자 쿠키 (외부 비공개)
    admin:
      type: apiKey
      in: cookie
      name: gugak_admin

  parameters:
    RequestNo:
      name: no
      in: path
      required: true
      description: 요청 번호 `R-MMDD-XXXXXXXX`
      schema: { type: string, pattern: "^R-\\d{4}-[A-HJ-NP-Z2-9]{8}$" }
    FileId:
      name: fileId
      in: path
      required: true
      description: 내보내기 작업 번호 (`ExportTask.id`)
      schema: { type: string }
    ShareNo:
      name: shareNo
      in: path
      required: true
      schema: { type: string }
    AccountId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    KeyId:
      name: id
      in: path
      required: true
      schema: { type: integer }

  responses:
    # 모든 오류 — 코드 · 문구 · HTTP 상태는 shared/error-codes.json (v0.1.1 기준 70개)
    Error:
      description: 오류 (`ErrorResponse`). 429 · 423 등 `retry_after` 가 있으면 `Retry-After` 머리글
      headers:
        Retry-After:
          description: 다시 시도할 때까지 초
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    # 로그인이 필요한 /api 경로 — 로그인 안 함(G13). 화면은 /login?next=<지금 주소> 로 보낸다 (frontend/src/api/client.ts)
    LoginRequired:
      description: "`AUTH_LOGIN_REQUIRED` — 로그인이 필요함 (세션이 끝났을 때 포함)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    # 관리자 API 응답 — 1차는 v0.1.1 코드 모양 그대로 (관리자 화면 이슈에서 스키마 보강)
    AdminObject:
      description: 관리자 응답 (모양은 proto_type/src/app/backend/src/admin/*.ts · INTERFACES §5)
      content:
        application/json:
          schema: { type: object }

  schemas:
    # --- 공통 값 이름 (INTERFACES §1) ---
    ScoreType:
      enum: [staff, jeongganbo]
      description: staff = 오선보 · jeongganbo = 정간보
    FileKind:
      enum: [image, pdf, midi, musicxml]
      description: 새 요청은 image · pdf 만 (midi · musicxml 은 이전 행 · 공유 악보로 만든 요청)
    RequestState:
      enum: [received, queued, converting, awaiting_type_answer, completed, service_down, expired]
      description: expired 는 저장하지 않고 보관 기간으로 계산해서 덮어쓴다
    Route:
      enum: [recognize, direct, fallback]
    ResultBand:
      enum: [trust, caution, fallback, direct]
    ValidityGrade:
      enum: [trust, caution, distrust]
    ExportFormat:
      enum: [mp3, pdf, midi, musicxml]

    # --- 오류 (INTERFACES §2) ---
    ErrorResponse:
      type: object
      required: [error, api_version]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [UPLOAD_TOO_LARGE] }
            message: { type: string }
            fix: { type: [string, "null"], description: 사용자가 할 일 }
            gate: { type: [string, "null"], description: "검사 지점 (G1 업로드 · G12 요청 한도 · G13 권한 …)" }
            retry_after: { type: [string, "null"], format: date-time }
            details: { type: object }
        api_version: { const: v1 }

    # --- 계정 ---
    Me:
      type: object
      required: [account, roles]
      properties:
        account:
          oneOf:
            - type: "null"
            - type: object
              required: [account_id, login_id, display_name]
              properties:
                account_id: { type: integer }
                login_id: { type: string, description: 이메일 }
                display_name: { type: string }
        roles: { type: array, items: { enum: [user, operator] } }

    # --- 요청 상태 (INTERFACES §4 RequestStatus) ---
    RequestStatus:
      type: object
      required: [id, file_kind, score_type, status, status_label, queue_position, route, result_band, fallback,
                 fallback_reason, fallback_message, retry_hint, type_mismatch, detected_type, validity_grade, engine,
                 received_at, expires_at, remaining_seconds, deadline_at, model_wait, has_original_instruments,
                 page_count, pages, notice]
      properties:
        id: { type: string, description: 요청 번호 }
        file_kind: { $ref: "#/components/schemas/FileKind" }
        score_type: { oneOf: [{ $ref: "#/components/schemas/ScoreType" }, { type: "null" }] }
        status: { $ref: "#/components/schemas/RequestState" }
        status_label: { type: string, description: "접수 · 대기 · 변환 중 · 종류 확인 · 완료 · 대체 · 서비스 중단 · 만료" }
        queue_position: { type: [integer, "null"] }
        route: { $ref: "#/components/schemas/Route" }
        result_band: { oneOf: [{ $ref: "#/components/schemas/ResultBand" }, { type: "null" }] }
        fallback: { type: boolean }
        fallback_reason:
          type: [string, "null"]
          description: "대문자 코드 — RECOGNITION_FAILED · TIMEOUT · ENGINE_DOWN · NO_NOTES · NO_SCORE_STRUCTURE · UNTRUSTED_RESULT · USER_REQUEST"
        fallback_message: { type: [string, "null"] }
        retry_hint: { type: [string, "null"] }
        type_mismatch: { type: boolean }
        detected_type: { oneOf: [{ $ref: "#/components/schemas/ScoreType" }, { type: "null" }] }
        validity_grade: { oneOf: [{ $ref: "#/components/schemas/ValidityGrade" }, { type: "null" }] }
        engine:
          oneOf:
            - type: "null"
            - { type: object, required: [name, version], properties: { name: { type: string }, version: { type: string } } }
        received_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, description: 보관 기한 (접수 + 24시간) }
        remaining_seconds: { type: integer }
        deadline_at: { type: string, format: date-time, description: "처리 마감 — 처리 시작 전이면 접수 + 제한 × 쪽 수, 시작했으면 시작 + 제한 × 쪽 수" }
        model_wait:
          oneOf:
            - type: "null"
            - type: object
              required: [model, display_name, state, expected_seconds, elapsed_seconds]
              properties:
                model: { type: string }
                display_name: { type: string }
                state: { enum: [cold, loading] }
                expected_seconds: { type: [integer, "null"] }
                elapsed_seconds: { type: [integer, "null"] }
        has_original_instruments: { type: boolean }
        pdf_page_count: { type: [integer, "null"] }
        midi_available: { type: [boolean, "null"], description: 지금 결과에 원본 MIDI 가 있는가 (결과 전이면 null) }
        from_shared: { type: boolean }
        validity_items:
          oneOf:
            - type: "null"
            - type: object
              properties:
                note_count: { type: number }
                beat_sum: { type: number }
                range_leap: { type: number }
                yulmyeong_ratio: { type: number }
                engine_confidence: { type: number }
        page_count: { type: integer, minimum: 1 }
        pages: { type: array, items: { $ref: "#/components/schemas/PageStatus" } }
        notice:
          oneOf:
            - type: "null"
            - type: object
              required: [code, message, pages, converted, failed_pages]
              description: "일부 쪽만 못 읽었을 때 — \"N쪽 중 M쪽 변환했어요 (못 읽은 쪽: 3·7쪽)\""
              properties:
                code: { const: PAGES_PARTIAL }
                message: { type: string }
                pages: { type: integer }
                converted: { type: integer }
                failed_pages: { type: array, items: { type: integer } }

    PageStatus:
      type: object
      required: [page_no, file_no, source, outcome, fallback_reason, fallback_message, validity_grade]
      properties:
        page_no: { type: integer }
        file_no: { type: integer }
        source: { enum: [file, pdf_page] }
        outcome: { enum: [pending, converted, failed] }
        fallback_reason: { type: [string, "null"] }
        fallback_message: { type: [string, "null"] }
        validity_grade: { oneOf: [{ $ref: "#/components/schemas/ValidityGrade" }, { type: "null" }] }
        short_edge_px: { type: [integer, "null"] }
        upscaled_short_side_px: { type: [integer, "null"], description: 작은 사진을 늘려 읽었으면 늘린 짧은 변 }

    # --- 결과 악보 · 편집 (INTERFACES §3, packages/score-core) ---
    ScoreResponse:
      type: object
      required: [scoredoc, musicxml, has_original_instruments, fallback, fallback_reason, fallback_message, retry_hint]
      properties:
        scoredoc: { $ref: "#/components/schemas/ScoreDoc" }
        musicxml: { type: string }
        has_original_instruments: { type: boolean }
        fallback: { type: boolean }
        fallback_reason: { type: [string, "null"] }
        fallback_message: { type: [string, "null"] }
        retry_hint: { type: [string, "null"] }

    ScoreDoc:
      type: object
      description: score-core 악보 문서 (브라우저 · 백엔드 공용). parts[0] = 원래 선율
      required: [version, ppq, tempoBpm, timeSignature, keyFifths, parts]
      properties:
        version: { const: 1 }
        title: { type: string }
        ppq: { type: integer, description: 4분음표당 틱 (480) }
        tempoBpm: { type: number }
        timeSignature:
          type: object
          required: [beats, beatType]
          properties: { beats: { type: integer }, beatType: { type: integer } }
        keyFifths: { type: integer, minimum: -7, maximum: 7 }
        parts:
          type: array
          items:
            type: object
            required: [id, name, instrument, isPercussion, volume, origin, notes]
            properties:
              id: { type: string, examples: [P1] }
              name: { type: string }
              instrument: { type: string, description: "악기 코드 (shared/instruments.json)" }
              sourceInstrument:
                oneOf:
                  - type: "null"
                  - { type: object, properties: { name: { type: string }, program: { type: [integer, "null"] } } }
              isPercussion: { type: boolean }
              volume: { type: integer, minimum: 0, maximum: 127 }
              origin: { enum: [original, melody_copy] }
              notes:
                type: array
                items:
                  type: object
                  required: [id, startTick, durationTicks, pitch, velocity]
                  properties:
                    id: { type: string, examples: [P1-n12] }
                    startTick: { type: integer }
                    durationTicks: { type: integer }
                    pitch: { type: integer, description: MIDI 음번호 }
                    velocity: { type: integer, minimum: 1, maximum: 127 }

    EditOp:
      description: 편집 연산 (part 는 0부터). 규칙은 score-core `validateOps` · `applyOps`
      oneOf:
        - { type: object, required: [op, instrument], properties: { op: { const: add_instrument }, instrument: { type: string } } }
        - { type: object, required: [op, part], properties: { op: { const: remove_track }, part: { type: integer } }, description: 추가한 트랙(melody_copy)만 }
        - { type: object, required: [op, part, instrument], properties: { op: { const: change_instrument }, part: { type: integer }, instrument: { type: string } }, description: 타악기는 타악 성부에만 · 선율 악기는 선율 성부에만 }
        - { type: object, required: [op, semitones], properties: { op: { const: transpose }, semitones: { type: integer } } }
        - { type: object, required: [op, part, velocity], properties: { op: { const: set_track_volume }, part: { type: integer }, velocity: { type: integer } } }
        - { type: object, required: [op, note_id, velocity], properties: { op: { const: set_note_volume }, note_id: { type: string }, velocity: { type: integer } } }
        - { type: object, required: [op, bpm], properties: { op: { const: set_tempo }, bpm: { type: integer, minimum: 20, maximum: 300 } } }
        - { type: object, required: [op, note_id, midi_pitch], properties: { op: { const: set_note_pitch }, note_id: { type: string }, midi_pitch: { type: integer } } }

    EditSummary:
      type: object
      description: score-core `summarizeOps(ops)` 결과 (편집 사용 지표용)

    ExportTask:
      type: object
      required: [id, format, basis, status, queue_position, failure_reason, notices, download_url, renderer]
      properties:
        id: { type: string }
        format: { $ref: "#/components/schemas/ExportFormat" }
        basis: { enum: [original, edited] }
        status: { enum: [queued, rendering, ready, failed] }
        queue_position: { type: [integer, "null"] }
        failure_reason: { enum: [RENDER_FAILED, RENDER_TIMEOUT, RENDERER_MISSING, ENGINE_DOWN, null] }
        notices: { type: array, items: { type: string } }
        download_url: { type: [string, "null"] }
        renderer: { type: [string, "null"] }

    # --- 악기 · 추천 ---
    Instrument:
      type: object
      required: [id, name, group, gm_program, percussion, range_low, range_high, soundfont]
      properties:
        id: { type: string }
        name: { type: string }
        group: { enum: [gugak, other, original] }
        gm_program: { type: [integer, "null"], description: 내려받는 MIDI · MusicXML 용 GM 호환 번호 }
        bank: { type: [integer, "null"], description: "서비스 안 연주 번호 — 일반 0(GM) · 국악기 1 · 장구 · 북 128" }
        program: { type: [integer, "null"] }
        percussion: { type: boolean }
        range_low: { type: [integer, "null"] }
        range_high: { type: [integer, "null"] }
        soundfont: { type: [string, "null"] }

    InstrumentCatalog:
      type: object
      required: [default_set, gugak, others]
      properties:
        default_set: { type: array, items: { type: string }, examples: [[gayageum, janggu]] }
        gugak: { type: array, items: { $ref: "#/components/schemas/Instrument" } }
        others: { type: array, items: { $ref: "#/components/schemas/Instrument" } }

    InstrumentChoiceBody:
      type: object
      required: [mode]
      properties:
        mode: { enum: [default, recommend, original, custom] }
        recommendation_index: { type: integer, minimum: 0 }
        tracks:
          type: array
          items:
            type: object
            required: [part, instrument]
            properties: { part: { type: integer }, instrument: { type: string } }

    Recommendation:
      type: object
      required: [available, reason, pending, combinations, model, features]
      properties:
        available: { type: boolean }
        reason: { type: [string, "null"] }
        pending: { type: boolean, description: LLM 준비 중이라 규칙표 결과만 먼저 줌 }
        combinations:
          type: array
          items:
            type: object
            required: [label, instruments]
            properties:
              label: { type: string, examples: ["아쟁 · 대금 · 장구"] }
              instruments: { type: array, items: { type: string } }
              reason: { type: string }
        model:
          oneOf:
            - type: "null"
            - { type: object, properties: { name: { type: string }, version: { type: string }, provider: { type: string } } }
        features:
          oneOf:
            - type: "null"
            - type: object
              properties:
                tempo: { type: string }
                bpm: { type: [number, "null"] }
                mode: { type: string }
                range: { type: string }
                density: { type: [number, "null"] }

    ModelStatusPublic:
      type: object
      required: [checked_at, model_api, models]
      properties:
        checked_at: { type: string, format: date-time }
        model_api: { enum: [running, stopped] }
        models:
          type: array
          items:
            type: object
            required: [name, display_name, kind, provider, state, expected_seconds]
            properties:
              name: { type: string }
              display_name: { type: string }
              kind: { enum: [omr_staff, omr_jeongganbo, recommend] }
              provider: { enum: [venv, ollama, builtin] }
              state: { enum: [ready, cold, loading, failed, unavailable] }
              expected_seconds: { type: [integer, "null"] }

    # --- 내 악보 · 공유 ---
    MyScoreItem:
      type: object
      required: [id, title, file_name, score_type, created_at, expires_at, remaining_seconds, edited, edit_ops, midi_available, fallback]
      properties:
        id: { type: string }
        title: { type: string }
        file_name: { type: [string, "null"] }
        score_type: { oneOf: [{ $ref: "#/components/schemas/ScoreType" }, { type: "null" }] }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        remaining_seconds: { type: integer }
        edited: { type: boolean }
        edit_ops: { type: [array, "null"], items: { $ref: "#/components/schemas/EditOp" } }
        midi_available: { type: boolean }
        fallback: { type: boolean }
        from_shared: { type: boolean }
        from_example: { type: boolean }

    ShareState:
      oneOf:
        - type: object
          required: [shared]
          properties: { shared: { const: false } }
        - type: object
          required: [shared, share_no, title, shared_at, taken_down]
          properties:
            shared: { const: true }
            share_no: { type: string }
            title: { type: string }
            shared_at: { type: string, format: date-time }
            expires_at: { type: string, format: date-time, description: 공유 + 3일 }
            taken_down: { type: boolean }

    SharedScoreList:
      type: object
      required: [sort, items, has_more]
      properties:
        sort: { enum: [likes, recent] }
        has_more: { type: boolean }
        items:
          type: array
          items:
            type: object
            required: [share_no, title, score_type, shared_at, likes, liked_by_me]
            properties:
              share_no: { type: string }
              title: { type: string }
              score_type: { $ref: "#/components/schemas/ScoreType" }
              shared_at: { type: string, format: date-time }
              expires_at: { type: [string, "null"], format: date-time }
              example: { type: boolean, description: 예시 공유 악보 }
              likes: { type: integer }
              liked_by_me: { type: boolean }

    SharedScoreBody:
      type: object
      required: [share_no, title, score_type, musicxml]
      properties:
        share_no: { type: string }
        title: { type: string }
        score_type: { $ref: "#/components/schemas/ScoreType" }
        musicxml: { type: string }

    # --- API 안내 ---
    ApiDocs:
      type: object
      required: [server_status, spec_source, checked_at, endpoints, guideline, manual]
      properties:
        server_status: { type: string }
        spec_source: { type: string, description: "live | last_known …" }
        checked_at: { type: [string, "null"], format: date-time }
        endpoints:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              method: { type: string }
              path: { type: string }
              summary: { type: string }
              description: { type: string }
              example: { type: string }
        guideline: { type: object }
        manual: { type: object }
