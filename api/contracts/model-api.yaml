    InstrumentAssignment:
      description: instruments 폼 필드에 넣는 JSON 문자열의 해석 규칙. mode 생략 시 tracks가 있으면 custom, 없으면 default. explicit은 custom의
        호환 이름. part 생략 시 tracks의 인덱스 사용. custom에는 tracks가 필요하다. sf2_ref는 gugak.sf2·gugak·FluidR3_GM.sf2·gm(대소문자
        무시)만 허용한다. 이 스키마는 해석된 객체의 설명용이며 실제 전송 자료형은 string이다.
      type: object
      properties:
        mode:
          type: string
          enum:
          - default
          - recommend
          - original
          - custom
          - explicit
        tracks:
          type: array
          items:
            type: object
            properties:
              part:
                type: integer
                minimum: 0
              instrument:
                type: string
              sf2_ref:
                anyOf:
                - type: string
                - type: 'null'
            required:
            - instrument
      required: []
    PerformanceInput:
      properties:
        score:
          items:
            type: string
            contentMediaType: application/octet-stream
          type: array
          title: Score
          description: '악보 한 곡: PDF 한 개(모든 쪽 변환) 또는 사진(PNG·JPG·WEBP) 여러 장(올린 순서) — 최대 10쪽'
        score_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Score Type
          description: '업무 검사상 필수: staff 또는 jeongganbo. v0.1.1은 Form(None) 선언 후 파일 검사에서 누락·잘못된 값을 UPLOAD_SCORE_TYPE_REQUIRED(422)로
            거절한다. 자동 명세의 optional 선언은 보존한다.'
        instruments:
          anyOf:
          - type: string
          - type: 'null'
          title: Instruments
          description: InstrumentAssignment를 JSON 문자열로 전송. 생략하면 기본 국악기 구성. 사용자 음원 파일은 받지 않는다.
          examples:
          - '{"mode":"default"}'
          - '{"mode":"custom","tracks":[{"part":0,"instrument":"geomungo"}]}'
        transpose_semitones:
          type: integer
          maximum: 12.0
          minimum: -12.0
          title: Transpose Semitones
          default: 0
        volume:
          type: number
          maximum: 2.0
          minimum: 0.0
          title: Volume
          description: 전체 음량 배율 0~2
          default: 1.0
      type: object
      required:
      - score
      title: PerformanceInput
      additionalProperties: false
