    fix: PDF 를 두 개 이상 올리거나 PDF 와 사진을 섞어 올릴 수 없습니다. PDF 한 개, 또는 사진(PNG·JPG(JPEG)·WEBP) 여러 장으로 다시 올려 주십시오.
