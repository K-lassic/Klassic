# backend · 외부 사용자 ↔ model-api 계약 — 담당: 예은 · 리뷰: 팀장
# 기준: proto_type v0.1.1. 자동 OpenAPI + 라우터·schemas.py·errors.py·호출부 대조.
openapi: 3.1.0
info:
  title: K-lassic model-api 계약
  version: 0.1.1
  description: |-
    backend·외부 사용자와 model-api 사이의 1차 계약. proto_type v0.1.1의 동작을 기록한다.
    실행 중인 /api/v1/openapi.json을 출발점으로 요청 스키마를 보존하고, 소스로 실제 응답·인증·오류를 보완했다.
    API 응답의 api_version은 v1이며, 이 문서의 0.1.1은 기준 서비스 판본이다.

    경로는 /v1/*, 외부 입구에서는 /api/v1/*이다. servers의 /api와 paths를 합쳐 사용한다.
    /v1/internal/*는 backend가 model-api 내부 주소로 직접 호출하는 경로다. 재구성에서는 서비스 DNS를 사용한다.
    기준 gateway는 /api/v1/internal/*를 404로 차단하므로 공개 입구를 통한 내부 호출은 불가능하다.

    사진 업로드는 PNG·JPG(JPEG)·WEBP 여러 장(순서 유지), 또는 PDF 한 개다. PDF 여러 개·사진 혼합은 거절한다.
    기준값: 최대 10쪽, 파일당 20MiB, 사진 짧은 변 300px 미만 거절, 650px 미만은 1000px 사본으로 인식.
    PDF는 각 쪽을 300dpi로 처리한다. DB 처리 설정이 지정되면 용량·시간 등 설정값이 우선한다.
    MIDI·MusicXML은 /recommend·/render/* 입력으로만 받으며 /performances·/omr/*에서는 거절한다(기준 파일당 5MiB).

    공개 health·versions·models와 서명 URL 다운로드를 제외하고 X-API-Key가 필요하다.
    오류는 error와 api_version을 가진 한 형식이며, 422도 FastAPI 기본 detail 형식이 아니다.
    429는 재시도 시각(error.retry_after)과 대기 초(Retry-After)를 제공한다.
    기본 role_permission에서 UC12(인식·추천·렌더링·목록)는 service/api_caller, UC13(연주)는 api_caller가 허용된다.
    서비스 키는 모든 경로의 관리자 키가 아니다. /performances는 기본 권한표에서 서비스 키를 403으로 거절한다.
    인식 실패·시간 초과는 HTTP 오류 대신 200 + fallback 또는 completed_fallback으로 끝날 수 있다.
    필드명·경로·상태를 바꾸는 개선은 이 계약에 섞지 않고 별도 계약 변경으로 진행한다.
paths:
  /v1/health:
    get:
      tags:
      - 상태
      summary: 서버 상태 (UC11 기본흐름 1)
      description: |-
        200 ok · 200 degraded(DB 끊김) · 503 loading(기동 때 엔진 데우는 중) · 503 unavailable(쓸 인식 엔진 없음)

        준비 완료의 정상 기준은 status=ok, db=ok, 시작 워밍업 종료, 오선보·정간보별 사용 가능한 enabled/installed 엔진 존재다. startup_done=false면 503 loading, 종료 후 missing_kinds가 있으면 503 unavailable. missing_kinds는 ready 또는 cold인 엔진을 사용 가능으로 센다. DB 실패 시 missing_kinds 검사를 생략하므로 200 degraded가 가능하다. 사운드폰트·렌더러 상태는 이 API만으로 보장하지 않는다. 기준을 강화할 경우 별도 계약 변경으로 진행한다.
      operationId: health_v1_health_get
      responses:
        '200':
          description: '상태 확인: ok 또는 degraded. DB 단절 시 200 degraded는 기준 동작이며 완전 준비를 뜻하지 않는다.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '503':
          description: 로딩 중 또는 사용 가능한 인식 종류가 없음. 공통 ErrorResponse가 아니라 상태 필드와 error가 함께 있다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Validation'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      x-key-kinds: []
      x-exposure: gateway
  /v1/versions:
    get:
      tags:
      - 상태
      summary: 엔진 이름·버전과 명세 (UC11 기본흐름 2 · FR-044)
      operationId: versions_v1_versions_get
      responses:
        '200':
          description: 엔진·렌더러 버전, 설치/준비 상태, 대체 템플릿 버전과 규칙 해시
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionsResponse'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Validation'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      x-key-kinds: []
      x-exposure: gateway
      description: 버전 조회 성공은 모든 모델의 준비 완료를 뜻하지 않는다. engines[].installed/state와 /health를 함께 확인한다. openapi_url은 모델
        API 기준 /v1/openapi.json이며 외부 입구에서는 /api를 앞에 붙인다.
  /v1/models:
    get:
      tags:
      - 상태
      summary: 모델 목록과 준비 상태
      operationId: list_models_v1_models_get
      responses:
        '200':
          description: 모델 상태 배열. 사용 중지·미설치 모델도 포함한다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelStateList'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Validation'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      x-key-kinds: []
      x-exposure: gateway
  /v1/internal/models/reload:
    post:
      tags:
      - 내부
      summary: 등록부 다시 읽기
      operationId: reload_models_v1_internal_models_reload_post
      responses:
        '200':
          description: DB 등록부를 다시 읽고 변경된 설치 venv 모델 워밍업 시작
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReloadModelsResponse'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Validation'
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-key-kinds:
      - service
      x-required-use-case: UC14
      x-exposure: internal
      description: 서비스 키 전용. 공개 gateway는 이 경로를 404로 차단한다. backend는 내부 model-api 주소로 직접 호출한다.
      requestBody:
        required: false
        description: 요청 본문은 사용하지 않는다. backend가 보내는 빈 JSON 객체도 허용한다.
        content:
          application/json:
            schema: {}
  /v1/internal/models/{name}/load:
    post:
      tags:
      - 내부
      summary: 모델 불러오기(워밍업) 시작
      operationId: load_model_v1_internal_models__name__load_post
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      - name: operator_id
        in: query
        required: false
        schema:
          type: string
        description: 호환 입력. JSON body.operator_id가 null/없을 때 숫자로만 된 문자열(isdigit)이면 사용한다(0 포함). 그 외 문자열은 무시한다.
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/LoadBody'
              - type: 'null'
              title: Body
      responses:
        '202':
          description: 비동기 로딩 시작 또는 기존 로딩 상태 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadModelResponse'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '422':
          $ref: '#/components/responses/Validation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
      x-key-kinds:
      - service
      x-required-use-case: UC14
      x-exposure: internal
      description: |-
        서비스 키 전용. 공개 gateway는 이 경로를 404로 차단한다. backend는 내부 model-api 주소로 직접 호출한다.

        multipart/form-data에서 파일 배열은 같은 필드명을 반복해 전송한다. 선언되지 않은 폼 필드는 422 VALIDATION_ERROR로 거절한다.
  /v1/internal/ollama/available:
    get:
      tags:
      - 내부
      summary: 공유 Ollama 서버에서 등록할 수 있는 모델
      operationId: ollama_available_v1_internal_ollama_available_get
      responses:
        '200':
          description: Ollama 연결·등록 가능 모델. 연결 실패도 200 + ollama=unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OllamaAvailableResponse'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Validation'
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-key-kinds:
      - service
      x-required-use-case: UC14
      x-exposure: internal
      description: 서비스 키 전용. 공개 gateway는 이 경로를 404로 차단한다. backend는 내부 model-api 주소로 직접 호출한다.
  /v1/internal/settings/reload:
    post:
      tags:
      - 내부
      summary: 새 처리 설정 반영
      operationId: reload_settings_v1_internal_settings_reload_post
      responses:
        '200':
          description: 최신 설정을 이후 요청에 적용. 진행 중 요청은 기존 설정 유지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReloadSettingsResponse'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Validation'
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-key-kinds:
      - service
      x-required-use-case: UC10
      x-exposure: internal
      description: 서비스 키 전용. 공개 gateway는 이 경로를 404로 차단한다. backend는 내부 model-api 주소로 직접 호출한다.
      requestBody:
        required: false
        description: 요청 본문은 사용하지 않는다. backend가 보내는 빈 JSON 객체도 허용한다.
        content:
          application/json:
            schema: {}
  /v1/internal/upload-check:
    post:
      tags:
      - 내부
      summary: 웹 업로드 검사 위임 (사진·PDF, 2026-09-29)
      description: |-
        웹 서비스가 PDF 를 접수하기 전에 부른다 — 열기(손상·암호) · 쪽수(10쪽 넘으면 UPLOAD_TOO_MANY_PAGES) · 20MB ·
        쪽마다 300dpi 로 그렸을 때의 사진 크기(300px 미만 반려, 2026-09-30 119번) · 악보 종류를 연주 API·/v1/omr 과 같은 검사기(checks/upload.py,
        pypdfium2)로 판정한다(SC-015, UC3 A7 · E2 · E9). 그림은 그리지 않고 쪽 크기로 잰다(인식 때 다시 그린다).
        통과면 쪽수·쪽마다 사진 크기를, 반려면 G1 사유 코드(UPLOAD_*) 오류를 돌려준다. 요청은 만들지 않는다.

        서비스 키 전용. 공개 gateway는 이 경로를 404로 차단한다. backend는 내부 model-api 주소로 직접 호출한다.

        multipart/form-data에서 파일 배열은 같은 필드명을 반복해 전송한다. 선언되지 않은 폼 필드는 422 VALIDATION_ERROR로 거절한다.
      operationId: upload_check_v1_internal_upload_check_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadCheckInput'
        required: true
      responses:
        '200':
          description: 파일 검사 통과. 새 악보 요청을 만들지 않음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadCheckResponse'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '422':
          $ref: '#/components/responses/Validation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/Unsupported'
      x-key-kinds:
      - service
      x-required-use-case: UC3
      x-exposure: internal
  /v1/omr/staff:
    post:
      tags:
      - 인식
      summary: 오선보 이미지 인식
      operationId: recognize_staff_v1_omr_staff_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StaffRecognitionInput'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecognitionResult'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '422':
          $ref: '#/components/responses/Validation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/Limited'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/Unsupported'
        '404':
          $ref: '#/components/responses/NotFound'
      x-key-kinds:
      - service
      - external
      x-required-use-case: UC12
      x-exposure: gateway
      description: |-
        multipart/form-data에서 파일 배열은 같은 필드명을 반복해 전송한다. 선언되지 않은 폼 필드는 422 VALIDATION_ERROR로 거절한다.

        한 곡의 모든 쪽을 순서대로 인식한다. 서비스 키 + request_no이면 기존 웹 요청에 판정만 기록하며 대체 악보 파일은 넣지 않는다. request_no가 없으면 API 요청을 생성하고 인식 실패 시 서버 보유 템플릿을 결과로 넣을 수 있다. 인식 실패·미설치·timeout·신뢰 불가·변환 실패는 200 RecognitionResult의 fallback/fallback_reason으로 나타날 수 있다. fallback=true나 service_down=true를 인식 성공으로 처리하지 않는다. 여러 쪽 중 일부 실패는 pages와 notice로 구분한다.
      parameters:
      - $ref: '#/components/parameters/Deadline'
  /v1/omr/jeongganbo:
    post:
      tags:
      - 인식
      summary: 정간보 이미지 인식
      operationId: recognize_jeongganbo_v1_omr_jeongganbo_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JeongganboRecognitionInput'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecognitionResult'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '422':
          $ref: '#/components/responses/Validation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/Limited'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/Unsupported'
        '404':
          $ref: '#/components/responses/NotFound'
      x-key-kinds:
      - service
      - external
      x-required-use-case: UC12
      x-exposure: gateway
      description: |-
        multipart/form-data에서 파일 배열은 같은 필드명을 반복해 전송한다. 선언되지 않은 폼 필드는 422 VALIDATION_ERROR로 거절한다.

        한 곡의 모든 쪽을 순서대로 인식한다. 서비스 키 + request_no이면 기존 웹 요청에 판정만 기록하며 대체 악보 파일은 넣지 않는다. request_no가 없으면 API 요청을 생성하고 인식 실패 시 서버 보유 템플릿을 결과로 넣을 수 있다. 인식 실패·미설치·timeout·신뢰 불가·변환 실패는 200 RecognitionResult의 fallback/fallback_reason으로 나타날 수 있다. fallback=true나 service_down=true를 인식 성공으로 처리하지 않는다. 여러 쪽 중 일부 실패는 pages와 notice로 구분한다.
      parameters:
      - $ref: '#/components/parameters/Deadline'
  /v1/recommend:
    post:
      tags:
      - 추천
      summary: 국악기 조합 추천
      operationId: recommend_v1_recommend_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecommendationInput'
        required: true
      responses:
        '200':
          description: 추천 결과. 추천 불가도 HTTP 200 + available=false + reason=RECOMMEND_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '422':
          $ref: '#/components/responses/Validation'
        '400':
