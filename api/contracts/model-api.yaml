    gate: G1
    message: 허용 용량을 넘었습니다.
    fix: 사진·PDF를 20MB 이하로 줄여 올려 주십시오.
  UPLOAD_RESOLUTION_TOO_LOW:
    http: 422
    gate: G1
    message: 더 선명한 사진이 필요합니다.
    fix: 사진 크기가 너무 작습니다(300픽셀 미만). 가로·세로 모두 300픽셀 이상인 사진으로 다시 찍어 올려 주십시오. 300~649픽셀 사진은 서비스가 키워서 읽습니다.
  UPLOAD_SCORE_TYPE_REQUIRED:
