    gate: G1
    message: 지금은 PDF 를 확인할 수 없습니다. 잠시 뒤 다시 올리거나 사진으로 올려 주십시오.
    fix: 잠시 뒤 다시 올리거나, 악보를 사진(PNG·JPG(JPEG)·WEBP)으로 찍어 올려 주십시오.
