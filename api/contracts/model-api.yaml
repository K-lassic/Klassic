    gate: G1
    message: 한 번에 10쪽까지 올릴 수 있습니다.
    fix: 사진은 10장까지, PDF 는 10쪽까지 한 번에 올릴 수 있습니다. 나눠서 따로 올려 주십시오.
  UPLOAD_UNSUPPORTED_TYPE:
