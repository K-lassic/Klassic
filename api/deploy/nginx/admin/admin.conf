# =============================================================================
# #22 관리자 server 경로 나누기 (담당: 팀장) — frontend Nginx 의 관리자 server 가 include 로 읽는다
#   (include /etc/nginx/klassic/admin/*.conf — 황송해 #21 과 맞춘 위치. 사용자 server 의 *.conf 는 이 폴더를 읽지 않는다)
#
#   구조에서의 위치
#     서버 PC 브라우저 ─▶ 127.0.0.1:26201 ─▶ frontend Nginx 관리자 server(8081)
#       /admin/*  → admin (백엔드 --role=admin · 관리자 API)
#       그 밖     → admin.html 정적 파일 (default.conf)
#   호스트 127.0.0.1 에만 열고 Funnel 은 가리키지 않는다 → 외부에서 관리자 API 에 닿을 길이 없다.
#
#   서비스 이름 · 포트 약속: admin(백엔드 관리자 API) 26101 — #23 의 compose 와 맞춘다
#   주의(#23 · #27 · 관리자 API): 백엔드 networkGuard 는 X-Forwarded-For 의 주소를 ADMIN_ALLOWED_CIDRS 와 비교한다.
#     로컬 브라우저 → Docker 포트 전달이라 그 주소는 compose 네트워크 게이트웨이(172.x.0.1)다 → 허용 범위에 넣어야 한다.
# =============================================================================

resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;
set $up_admin admin:26101;

# 실제 접속 주소 — 사용자 server(proxy.conf)와 같은 규칙
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# 관리자 화면은 큰 파일을 올리지 않는다 (설정 · 모델 등록 JSON 정도)
client_max_body_size 2m;
proxy_connect_timeout 10s;
proxy_read_timeout 120s;   # 평가 실행 시작 · 모델 불러오기 요청 응답까지
proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection        "";

error_page 502 503 504 = @admin_down;

location ^~ /admin/ {
    proxy_pass http://$up_admin;
}

location @admin_down {
    default_type application/json;
    return 502 '{"error":{"code":"WEB_UNAVAILABLE","message":"관리자 서버가 응답하지 않아요.","gate":null,"retry_after":null,"details":{}},"api_version":"v1"}';
}
