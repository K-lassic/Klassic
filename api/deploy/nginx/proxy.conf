# =============================================================================
# #22 사용자 server 경로 나누기 (담당: 팀장) — frontend Nginx 의 사용자 server 가 include 로 읽는다
#
#   구조에서의 위치
#     인터넷 ─HTTPS─ Tailscale Funnel ─▶ 127.0.0.1:9603 ─▶ frontend Nginx 사용자 server(8080)
#       /api/v1/*       → model-api   (외부 API · 인식 · 렌더링)     ※ /api/v1/internal/* 은 404
#       /api/* · /soundfonts/* → web  (백엔드 사용자 API · 음원 파일)
#       /admin/*        → 404         (관리자 API 는 관리자 server 에서만 — admin/admin.conf)
#       /demo/*         → demo        (외부 API 예시 홈페이지 #93, 꺼져 있으면 안내 화면)
#       그 밖           → 화면 정적 파일 (services/frontend/nginx/default.conf, 황송해 · #21)
#   이 파일은 server 블록 안에 들어간다 — upstream · map 처럼 http 단계 지시어는 쓸 수 없다.
#
#   서비스 이름 · 포트 약속 (#23 · #24 의 compose 와 맞춘다)
#     web(백엔드 사용자 API) 9523 · model-api 9543 · demo 26102 — 같은 compose 프로젝트 기본 네트워크
#   v0.1.1 참고: proto_type/src/app/ops/gateway.mjs (경로 규칙 · 내부 API 차단 · 대기 시간 · 오류 JSON)
# =============================================================================

# --- 서비스 주소 -------------------------------------------------------------
# 주소를 변수로 두고 Docker 내부 DNS 로 요청 때마다 찾는다.
# 변수 없이 쓰면 Nginx 가 시작할 때 이름을 찾아서, 백엔드 · model-api 가 아직 없으면("host not found") 뜨지 않는다.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;
set $up_web        web:9523;
set $up_model_api  model-api:9543;

# --- 실제 접속 주소 (#9 에서 찾은 문제) -----------------------------------------
# Funnel → 호스트 → Docker 포트 전달로 들어오면 연결 출발지는 compose 네트워크 게이트웨이(172.x.0.1)다.
# 호스트 포트를 127.0.0.1 에만 열었으므로 사설 대역에서 오는 것은 이 PC 안(Tailscale · 로컬 브라우저)뿐이다
# → 그 대역이 보낸 X-Forwarded-For 만 믿고, 백엔드에는 실제 주소 하나만 넘긴다 (v0.1.1 gateway 와 같음).
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# HTTPS 여부 — Funnel 이 넘긴 값이 있으면 그것, 없으면(로컬 http 시험) 지금 연결 방식. 백엔드 쿠키 Secure 판단에 쓴다 (#37)
set $fwd_proto $scheme;
if ($http_x_forwarded_proto) { set $fwd_proto $http_x_forwarded_proto; }

# --- 업로드 · 대기 시간 -------------------------------------------------------
# 업로드 상한: 사진 10장 × 20MiB + 여유. 파일 종류 · 크기 판정은 백엔드가 한다
# (2026-11-04 #168) 쪽 수 상한은 30 으로 늘렸지만(shared/upload-rules.json) 이 값은 측정 전이라 그대로 — 30장 × 20MiB 는 여기서 413
client_max_body_size 210m;
client_body_timeout 300s;
# 인식은 쪽마다 수십 초 ~ 최대 180초 × 10쪽 — v0.1.1 gateway 와 같은 15분 (30쪽 기준으로는 아직 다시 정하지 않음)
proxy_connect_timeout 10s;
proxy_send_timeout 900s;
proxy_read_timeout 900s;
# 요청 본문을 모으지 않고 바로 넘긴다 — /tmp 가 메모리(tmpfs)라 큰 업로드를 쌓아 두지 않게 (frontend compose read_only)
proxy_request_buffering off;
proxy_http_version 1.1;

# 위 서비스로 넘길 때 공통 머리글
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $fwd_proto;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Connection        "";

# 서비스가 꺼져 있거나 응답이 없으면 v0.1.1 과 같은 모양의 JSON 오류
proxy_intercept_errors off;
error_page 502 503 504 = @upstream_down;
# 상한을 넘는 업로드는 백엔드에 닿기 전에 여기서 막힌다 — 화면이 읽는 JSON 모양으로 (shared 오류 코드 UPLOAD_TOO_LARGE)
error_page 413 = @too_large;

# --- 경로 ----------------------------------------------------------------------
# 내부 API 는 밖에서 막는다 (서비스 키로도 막혀 있지만 한 겹 더 — v0.1.1 gateway 와 같음)
location ^~ /api/v1/internal {
    default_type application/json;
    return 404 '{"error":{"code":"NOT_FOUND","message":"없는 경로예요.","gate":null,"retry_after":null,"details":{}},"api_version":"v1"}';
}

# 외부 API · 모델 API — 앞의 /api 를 떼고 넘긴다 (model-api 는 --root-path /api 로 떠서 문서 · 파일 링크를 /api/v1/... 로 만든다)
location = /api/v1 { rewrite ^/api(/v1)$ $1 break; proxy_pass http://$up_model_api; }
location ^~ /api/v1/ {
    rewrite ^/api(/v1/.*)$ $1 break;
    proxy_pass http://$up_model_api;
}

# 백엔드 사용자 API
location ^~ /api/ {
    proxy_pass http://$up_web;
}

# 브라우저 연주용 음원 — 지난 발표 피드백 "재생 지연"
#   지금은 v0.1.1 처럼 매번 바뀌었는지 묻는다(백엔드 ETag → 안 바뀌었으면 304, 다시 받지 않음).
#   파일 이름에 판본을 붙이기로 #42 와 정하면 여기서 "max-age=31536000, immutable" 로 바꿔 확인 요청도 없앤다.
location ^~ /soundfonts/ {
    proxy_pass http://$up_web;
    # #36 큰 음원(142MB)을 /tmp(메모리 tmpfs)에 쌓지 않고 흘려보낸다
    proxy_max_temp_file_size 0;
}

# 관리자 API 는 사용자 server(외부 공개 쪽)에서 열지 않는다 — 화면 HTML 이 대신 나오지 않게 명시적으로 404
location ^~ /admin {
    default_type application/json;
    return 404 '{"error":{"code":"NOT_FOUND","message":"없는 경로예요.","gate":null,"retry_after":null,"details":{}},"api_version":"v1"}';
}

# 외부 API 예시(demo) 홈페이지 (#93) — demo 서버는 model-api compose 의 `demo` 프로필 (박예은 · PR #131)
#   demo 서버가 /demo 접두사를 유지한 요청을 받으므로 떼지 않고 그대로 넘긴다 (proxy_pass 에 URI 를 붙이지 않음).
#   주소를 변수로 찾으므로 demo 프로필이 꺼져 있어도 Nginx 는 뜬다 → 그때는 @demo_down 안내 화면.
#   외부 키는 demo 서버 환경변수에만 있다 — 브라우저 · 이 파일에는 키가 오가지 않는다.
set $up_demo demo:26102;
location = /demo {
    # Funnel 뒤에서 http://…:8080 같은 컨테이너 안 주소로 튀지 않게 상대 주소로 보낸다
    absolute_redirect off;
    return 301 /demo/;
}
location ^~ /demo/ {
    proxy_pass http://$up_demo;
    # MP3(최대 20MiB)를 /tmp(메모리 tmpfs)에 쌓지 않고 흘려보낸다
    proxy_max_temp_file_size 0;
    error_page 502 503 504 = @demo_down;
}

location @too_large {
    default_type application/json;
    return 413 '{"error":{"code":"UPLOAD_TOO_LARGE","message":"허용 용량을 넘었습니다.","fix":"사진·PDF를 20MB 이하로 줄여 올려 주십시오.","gate":"G1","retry_after":null,"details":{}},"api_version":"v1"}';
}

# demo 프로필이 꺼져 있거나 응답이 없을 때 (#93) — 브라우저로 여는 화면이라 JSON 대신 짧은 HTML
#   demo 서버가 스스로 돌려준 502(API 장애 안내)는 proxy_intercept_errors off 라 여기로 오지 않고 그대로 간다.
location @demo_down {
    default_type text/html;
    add_header Cache-Control "no-store" always;
    return 503 '<!doctype html><meta charset="utf-8"><title>K-lassic 예시</title><p>외부 API 예시 홈페이지가 지금 꺼져 있어요. 잠시 뒤 다시 열어 주세요.</p>';
}

location @upstream_down {
    default_type application/json;
    return 502 '{"error":{"code":"WEB_UNAVAILABLE","message":"서버가 잠시 응답하지 않아요. 잠시 뒤 다시 해 주세요.","gate":null,"retry_after":null,"details":{}},"api_version":"v1"}';
}
