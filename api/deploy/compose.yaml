# =============================================================================
# #20 deploy — MariaDB · 마이그레이션 (담당: 팀장)
#   참고: proto_type/docker-compose.yml 의 db · migrate
#   - proto_type 과 같이 띄운다: 프로젝트 이름 klassic-api → 컨테이너 klassic-api-db-1 · 볼륨 klassic-api_db-data
#   - DB 는 호스트 포트를 열지 않는다. 같은 프로젝트 기본 네트워크에서 서비스 이름 `db` 로만 접속한다
#   - Nginx(경로 나누기 #22) · Funnel 은 이 파일에 더한다
# =============================================================================
services:
  db:
    # 버전 고정 (작성규칙 2-2) — proto_type 의 mariadb:12.0 과 같은 이미지(12.0.2)
    image: mariadb:12.0.2
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?api/.env 에 DB_ROOT_PASSWORD 가 필요합니다}
      MARIADB_DATABASE: ${DB_NAME:?api/.env 에 DB_NAME 이 필요합니다}
      MARIADB_USER: ${DB_USER:?api/.env 에 DB_USER 가 필요합니다}
      MARIADB_PASSWORD: ${DB_PASSWORD:?api/.env 에 DB_PASSWORD 가 필요합니다}
    volumes:
      # 이름 있는 볼륨 — Docker 내부 디스크라 빠르고, Windows 폴더 바인드 마운트의 권한 문제가 없다
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # 자원 한도 (작성규칙 4-6) — 2026-10-30 proto_type DB 측정 약 110MB(버퍼 풀 128MB) + 여유
    mem_limit: 512m

  migrate:
    # #17 마이그레이션 실행기 — db 와 같은 이미지라 mariadb 클라이언트가 들어 있다 (Node 없이 실행)
    image: mariadb:12.0.2
    restart: "no"
    entrypoint: ["sh", "/db/migrate.sh"]
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ../db:/db:ro
    depends_on:
      db: { condition: service_healthy }

volumes:
  db-data:
