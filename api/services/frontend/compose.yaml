# frontend — 사용자 화면 · 관리자 화면 정적 파일 서빙 (담당: 황송해 · #21)
#   이 Nginx 가 api/ 의 입구다. 경로 나누기는 deploy/nginx 를 붙여 include 로 읽는다 (#22).
#   포트 값은 api/.env (형식: api/.env.example) — 둘 다 127.0.0.1 에만 공개, Funnel 은 사용자 포트만 가리킨다.
services:
  frontend:
    build:
      context: .
      # 자기 폴더 밖의 공용 파일은 별명으로 넘겨 이미지에 굽는다 (#19 — api/shared/README.md 「이미지에 넣는 방법」)
      additional_contexts:
        shared: ../../shared
        score-core: ../../packages/score-core
    image: ${DOCKERHUB_NAMESPACE:-klassic}/frontend:${APP_TAG:-dev}
    ports:
      - "127.0.0.1:${API_PUBLIC_PORT:-9603}:8080"
      - "127.0.0.1:${API_ADMIN_PORT:-26201}:8081"
    volumes:
      # deploy 와 맞물리는 곳은 이 한 줄뿐이다 — 바꾸지 않는다
      - ../../deploy/nginx:/etc/nginx/klassic:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
