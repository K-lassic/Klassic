# =============================================================================
# frontend Nginx — 화면 정적 파일 서빙 (담당: 황송해 · #21)
#   경로 나누기(/api · /api/v1 · /soundfonts · 실제 접속 주소 · 업로드 크기)는 팀장 파일
#   api/deploy/nginx/ 를 실행할 때 /etc/nginx/klassic:ro 로 붙여 include 로 읽는다 (#22).
#   붙이지 않으면 include 할 파일이 없어 화면만 내준다 (glob 은 맞는 파일이 없어도 오류가 아니다).
#   컨테이너 안 포트: 사용자 8080 · 관리자 8081 (non-root 라 1024 미만을 쓰지 않는다)
# =============================================================================

server_tokens off;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

# 사용자 server — 호스트 127.0.0.1:${API_PUBLIC_PORT} (Funnel 이 가리키는 곳)
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # 관리자 진입점은 사용자 포트에서 내주지 않는다
    location = /admin.html { return 404; }

    # Vite 산출물은 파일 이름에 해시가 붙어 있어 오래 캐시해도 된다
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # history 라우터 — 없는 경로는 index.html 로 돌려 새로고침해도 화면이 유지되게 한다.
    # index.html 은 새 배포가 바로 보이도록 매번 확인하게 한다.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    include /etc/nginx/klassic/*.conf;
}

# 관리자 server — 호스트 127.0.0.1:${API_ADMIN_PORT} 에만 공개 (Funnel 금지)
server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html;

    # 관리자 화면은 해시 라우터(admin.html#/…)라 admin.html 한 파일만 있으면 된다
    location = / { try_files /admin.html =404; add_header Cache-Control "no-cache"; }
    location = /admin.html { add_header Cache-Control "no-cache"; }
    location = /index.html { return 404; }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 탭 아이콘 등 public/ 파일만 내주고, 그 밖의 경로는 404
    location / { try_files $uri =404; }

    # /admin/* → backend(admin) 는 팀장 파일 (#22)
    include /etc/nginx/klassic/admin/*.conf;
}
