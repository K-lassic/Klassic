# =============================================================================
# #23 backend — web(사용자 API) · admin(관리자 API) (담당: 팀장)
#   같은 이미지를 --role 만 바꿔 두 컨테이너로 띄운다. 호스트 포트는 열지 않는다 — Nginx(#22)만 서비스 이름으로 부른다.
#   서비스 이름 · 컨테이너 안 포트는 #22 와 약속한 값: web 9523 · admin 26101
#   참고: proto_type/docker-compose.yml 의 web · admin (그쪽은 network_mode: service:web 우회 — 여기서는 쓰지 않는다)
# =============================================================================
x-backend: &backend
  build:
    context: .
    # 이 폴더 밖의 공용 파일을 빌드에 넘겨 이미지에 굽는다 (api/shared/README.md 「이미지에 넣는 방법」)
    additional_contexts:
      shared: ../../shared
      score-core: ../../packages/score-core
  image: ${DOCKERHUB_NAMESPACE:-klassic}/backend:${APP_TAG:-dev}
  restart: unless-stopped
  environment:
    DB_HOST: db
    DB_PORT: "3306"
    DB_NAME: ${DB_NAME:?api/.env 에 DB_NAME 이 필요합니다}
    DB_USER: ${DB_USER:?api/.env 에 DB_USER 가 필요합니다}
    DB_PASSWORD: ${DB_PASSWORD:?api/.env 에 DB_PASSWORD 가 필요합니다}
    SESSION_SECRET: ${SESSION_SECRET:?api/.env 에 SESSION_SECRET(32자 이상)이 필요합니다}
    ADDR_HASH_SALT: ${ADDR_HASH_SALT:?api/.env 에 ADDR_HASH_SALT(16자 이상)가 필요합니다}
    SIGNUP_HOURLY_CAP: ${SIGNUP_HOURLY_CAP:-5}
    SERVICE_API_KEY: ${SERVICE_API_KEY:-}
    MODEL_API_URL: http://model-api:9543
    PUBLIC_API_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:9603}/api
    LOG_LEVEL: ${LOG_LEVEL:-info}
    PERIODIC_JOB_SECONDS: ${PERIODIC_JOB_SECONDS:-21600}
    # #100 관리자 API 접속 허용 범위(CIDR) — admin 만 읽는다. 기본값은 config/env.ts 와 같아야 한다. 비우지 않는다(비면 시작하지 않는다)
    ADMIN_ALLOWED_CIDRS: ${ADMIN_ALLOWED_CIDRS:-127.0.0.1/32,::1/128,172.16.0.0/12}
  depends_on:
    # DB 가 준비되고 마이그레이션이 끝난 뒤 뜬다 (작성규칙 4-2 · #20 의 migrate)
    migrate: { condition: service_completed_successfully }
  # 보안 옵션 (작성규칙 4-6) — 뿌리는 읽기 전용, 쓸 수 있는 곳은 사용자 파일 볼륨(#34)과 /tmp 뿐
  read_only: true
  tmpfs: [/tmp]
  volumes:
    - storage:/storage
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  web:
    <<: *backend
    command: ["node", "dist/server.js", "--role=web"]
    volumes:
      - storage:/storage
      # #36 브라우저 연주용 음원(164MB) — 이미지에 굽지 않고 읽기 전용으로 붙인다 (작성규칙 4-6)
      - ../../shared/soundfonts:/soundfonts:ro
    healthcheck:
      # 준비 기준 health — DB · 설정 판본을 읽을 수 있을 때만 200 (slim 이미지라 curl 대신 node fetch)
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9523/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # 자원 한도 — 업로드는 검사가 끝날 때까지 메모리에 있다. 2026-11-01 측정: 최대 크기(190MB) 3건 동시에 512m 를 다 쓰고 스왑으로 28초 (#34)
    #   → 1g 로 올린 뒤 같은 시험 최대 677MB · 15초. 인식 작업자가 붙으면 다시 잰다 (#49)
    mem_limit: 1g

  admin:
    <<: *backend
    command: ["node", "dist/server.js", "--role=admin"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:26101/admin/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # 2026-10-30 v0.1.1 admin 측정 33MB + 여유
    mem_limit: 256m

volumes:
  # #34 사용자 파일(원본 · 결과). 사라지면 안 되므로 이름 있는 볼륨 (작성규칙 4-7)
  storage:
