[project]
name = "klassic-model-api"
version = "0.1.0"
description = "K-lassic model-api 기반 서비스"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "aiomysql>=0.2,<1",
  "python-multipart>=0.0.9,<1",
  "pillow>=10.4,<13",
  "pypdfium2>=5.13,<6",
  "music21>=9.1,<10",
  "opencv-python-headless>=4.10,<5",
  "mido>=1.3,<2",
  "verovio>=5.2,<6",
  "svglib>=1.5,<3",
  "reportlab>=4.2,<5",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1", "ruff>=0.6,<1", "PyYAML>=6,<7", "jsonschema>=4.23,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
