# model-api의 엔진 볼륨·설치 검사 (#25, 담당: 예은)
# HTTP 서비스는 #24에서 추가한다. 검사 도구는 --profile tools로만 실행한다.
# #24의 model-api에도 이 fragment를 병합하고 engine-volume 마운트를 재사용한다.
x-engine-runtime: &engine-runtime
  platform: linux/amd64
  environment: &engine-environment
    ENGINES_DIR: ${ENGINES_DIR:-/opt/gugak-engines}
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUNBUFFERED: "1"
    XDG_CACHE_HOME: /tmp/engine-cache
    MPLCONFIGDIR: /tmp/matplotlib
  volumes:
    - &engine-volume
      type: volume
      source: engines
      target: ${ENGINES_DIR:-/opt/gugak-engines}
      read_only: true
      volume:
        nocopy: true

services:
  engine-selftest:
    <<: *engine-runtime
    profiles: [tools]
    # 기존 Linux model-api 런타임을 검사에만 사용한다. 로컬 빌드/보유가 선행돼야 한다.
    image: ${ENGINE_CHECK_IMAGE:-klassic/klassic-model-api:0.1.1}
    pull_policy: never
    user: "1000:1000"
    environment:
      <<: *engine-environment
      PYTHONPATH: /app/model-api
    entrypoint: [python, -B, /checks/engine_selftest.py]
    command: []
    healthcheck:
      disable: true
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777
    volumes:
      - *engine-volume
      - type: bind
        source: ./scripts/engine_selftest.py
        target: /checks/engine_selftest.py
        read_only: true
        bind:
          create_host_path: false

volumes:
  engines:
    # 새 빈 볼륨을 자동 생성하지 않는다. 기존 설치 결과만 읽는다.
    external: true
    name: ${ENGINES_VOLUME_NAME:-klassic_engines}
