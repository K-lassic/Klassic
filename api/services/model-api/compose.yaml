# model-api의 엔진 볼륨·설치 검사 (#25, 담당: 예은)
# #24 HTTP 서비스와 #25 검사 도구가 동일한 엔진 환경·읽기 전용 마운트를 사용한다.
# 검사 도구는 --profile tools로만 실행한다.
x-engine-runtime: &engine-runtime
  platform: linux/amd64
  environment: &engine-environment
    ENGINES_DIR: ${ENGINES_DIR:-/opt/gugak-engines}
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUNBUFFERED: "1"
    XDG_CACHE_HOME: /tmp/engine-cache
    MPLCONFIGDIR: /tmp/matplotlib
  volumes:
    - &engine-volume
      type: volume
      source: engines
      target: ${ENGINES_DIR:-/opt/gugak-engines}
      read_only: true
      volume:
        nocopy: true

services:
  model-api:
    <<: *engine-runtime
    init: true
    image: ${MODEL_API_IMAGE:-klassic/model-api:0.2.3}
    build:
      context: .
      additional_contexts:
        shared: ../../shared
    restart: unless-stopped
    # #33·#49: 렌더링 6건 동시 최대 3.35GiB 실측에 여유를 더함(2026-11-03 팀장 전달).
    mem_limit: 4g
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      <<: *engine-environment
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:?api/.env 에 DB_NAME 이 필요합니다}
      DB_USER: ${DB_USER:?api/.env 에 DB_USER 가 필요합니다}
      DB_PASSWORD: ${DB_PASSWORD:?api/.env 에 DB_PASSWORD 가 필요합니다}
      DB_CONNECT_ATTEMPTS: ${DB_CONNECT_ATTEMPTS:-5}
      DB_RETRY_SECONDS: ${DB_RETRY_SECONDS:-2}
      SHARED_DIR: ${SHARED_DIR:-/app/shared}
      SOUNDFONTS_DIR: ${SOUNDFONTS_DIR:-/app/shared/soundfonts}
      JEONGGANBO_DEVICE: cpu
      MODEL_LOAD_TIMEOUT_SECONDS: ${MODEL_LOAD_TIMEOUT_SECONDS:-120}
      RENDER_TIMEOUT_SECONDS: ${RENDER_TIMEOUT_SECONDS:-120}
      FILE_TOKEN_TTL_SECONDS: ${FILE_TOKEN_TTL_SECONDS:-900}
      FILE_TOKEN_SECRET: ${FILE_TOKEN_SECRET:-}
      BUSY_RETRY_AFTER_SECONDS: ${BUSY_RETRY_AFTER_SECONDS:-5}
      UPLOAD_READ_TIMEOUT_SECONDS: ${UPLOAD_READ_TIMEOUT_SECONDS:-300}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-220200960}
      RECOGNITION_TIMEOUT_MAX_SECONDS: ${RECOGNITION_TIMEOUT_MAX_SECONDS:-180}
      PURGE_INTERVAL_SECONDS: ${PURGE_INTERVAL_SECONDS:-600}
      ORPHAN_RETENTION_HOURS: ${ORPHAN_RETENTION_HOURS:-24}
      STORAGE_DIR: /storage
      SHARED_SCORES_DIR: /shared-scores
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      shared-storage-init: {condition: service_completed_successfully}
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777
    volumes:
      - *engine-volume
      - model-storage:/storage
      # #93 최소권한: 사용자 원본이 있는 storage 전체 대신 shared/ 하위만 읽는다.
      - type: volume
        source: storage
        target: /shared-scores
        read_only: true
        volume:
          subpath: shared
          nocopy: true
      - type: bind
        source: ../../shared/soundfonts
        target: /app/shared/soundfonts
        read_only: true
        bind:
          create_host_path: false

  shared-storage-init:
    # 빈 볼륨에도 subpath가 먼저 생기도록 하는 일회성 준비 작업. DB·네트워크는 사용하지 않는다.
    image: ${MODEL_API_IMAGE:-klassic/model-api:0.2.3}
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    entrypoint: [python, -m, app.tools.init_shared_storage]
    healthcheck: {disable: true}
    volumes:
      - storage:/storage

  demo:
    profiles: [demo]
    build:
      context: ./demo
    image: ${DEMO_IMAGE:-klassic/api-demo:0.2.2}
    init: true
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      DEMO_API_BASE: ${DEMO_API_BASE:-http://model-api:9543}
      DEMO_API_KEY: ${DEMO_API_KEY:-}
      DEMO_PORT: "26102"
    expose: ["26102"]
    depends_on:
      model-api: {condition: service_healthy}

  shared-seed:
    profiles: [tools]
    image: ${MODEL_API_IMAGE:-klassic/model-api:0.2.3}
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: [python, -m, app.tools.seed_shared_examples]
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:?DB_NAME 이 필요합니다}
      DB_USER: ${DB_USER:?DB_USER 가 필요합니다}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 가 필요합니다}
      SHARED_SCORES_DIR: /shared-scores
    volumes:
      - type: volume
        source: storage
        target: /shared-scores
        volume:
          subpath: shared
          nocopy: true
    depends_on:
      db: {condition: service_healthy}
      shared-storage-init: {condition: service_completed_successfully}

  engines-installer:
    # #138 설치 때만 쓰는 일회성 도구. DB·서버 키를 전달하지 않고 engines만 쓴다.
    profiles: [tools]
    platform: linux/amd64
    image: ${ENGINES_INSTALLER_IMAGE:-klassic/engines-installer:0.2.2}
    build:
      context: ./installer
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      # :?는 비활성 tools 프로필까지 일반 compose 실행을 막으므로 설치기 시작 시 필수 검사한다.
      ENGINES_VOLUME_NAME: ${ENGINES_VOLUME_NAME:-}
      ENGINES_DIR: ${ENGINES_DIR:-/opt/gugak-engines}
      UV_PYTHON_INSTALL_DIR: ${ENGINES_DIR:-/opt/gugak-engines}/.uv-python
      UV_PYTHON_BIN_DIR: /tmp/python-bin
      UV_CACHE_DIR: /tmp/uv-cache
      UV_LINK_MODE: copy
    volumes:
      # 빈 외부 볼륨의 최초 마운트에서는 이미지의 UID 1000 디렉터리 소유권을 물려받는다.
      - type: volume
        source: engines-install-target
        target: ${ENGINES_DIR:-/opt/gugak-engines}
      # 대형 wheel 캐시는 RAM(tmpfs)이 아니라 임시 디스크 볼륨. run --rm 종료 시 함께 제거한다.
      - /tmp

  engine-selftest:
    <<: *engine-runtime
    profiles: [tools]
    # #142 구조에서의 위치: tools 자가 검사 → api의 model-api 이미지 → 읽기 전용 엔진 볼륨.
    # 명시한 검사 이미지가 없으면 서비스와 같은 이미지를 사용한다. 먼저 model-api를 빌드한다.
    image: ${ENGINE_CHECK_IMAGE:-${MODEL_API_IMAGE:-klassic/model-api:0.2.3}}
    pull_policy: never
    user: "1000:1000"
    environment:
      <<: *engine-environment
      PYTHONPATH: /app/services/model-api
      TMPDIR: /tmp
    entrypoint: [python, -B, /checks/engine_selftest.py]
    command: []
    healthcheck:
      disable: true
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777
    volumes:
      - *engine-volume
      - type: bind
        source: ./scripts/engine_selftest.py
        target: /checks/engine_selftest.py
        read_only: true
        bind:
          create_host_path: false

volumes:
  engines-install-target:
    # 설치기는 미지정 시 운영 볼륨을 마운트하지 않는다. 일반 서비스의 engines 정의는 유지한다.
    external: true
    name: ${ENGINES_VOLUME_NAME:-klassic_engine_install_target_required}
  # backend Compose의 같은 이름·정의와 공유한다(include 병합 시 동일 자원).
  storage:
  model-storage:
  engines:
    # 새 빈 볼륨을 자동 생성하지 않는다. 기존 설치 결과만 읽는다.
    external: true
    name: ${ENGINES_VOLUME_NAME:-klassic_engines}
