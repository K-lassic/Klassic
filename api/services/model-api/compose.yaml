# model-api의 엔진 볼륨·설치 검사 (#25, 담당: 예은)
# #24 HTTP 서비스와 #25 검사 도구가 동일한 엔진 환경·읽기 전용 마운트를 사용한다.
# 검사 도구는 --profile tools로만 실행한다.
x-engine-runtime: &engine-runtime
  platform: linux/amd64
  environment: &engine-environment
    ENGINES_DIR: ${ENGINES_DIR:-/opt/gugak-engines}
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUNBUFFERED: "1"
    XDG_CACHE_HOME: /tmp/engine-cache
    MPLCONFIGDIR: /tmp/matplotlib
  volumes:
    - &engine-volume
      type: volume
      source: engines
      target: ${ENGINES_DIR:-/opt/gugak-engines}
      read_only: true
      volume:
        nocopy: true

services:
  model-api:
    <<: *engine-runtime
    init: true
    image: ${MODEL_API_IMAGE:-klassic/model-api:0.2.2}
    build:
      context: .
      additional_contexts:
        shared: ../../shared
    restart: unless-stopped
    # #33·#49: 렌더링 6건 동시 최대 3.35GiB 실측에 여유를 더함(2026-11-03 팀장 전달).
    mem_limit: 4g
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      <<: *engine-environment
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:?api/.env 에 DB_NAME 이 필요합니다}
      DB_USER: ${DB_USER:?api/.env 에 DB_USER 가 필요합니다}
      DB_PASSWORD: ${DB_PASSWORD:?api/.env 에 DB_PASSWORD 가 필요합니다}
      DB_CONNECT_ATTEMPTS: ${DB_CONNECT_ATTEMPTS:-5}
      DB_RETRY_SECONDS: ${DB_RETRY_SECONDS:-2}
      SHARED_DIR: ${SHARED_DIR:-/app/shared}
      SOUNDFONTS_DIR: ${SOUNDFONTS_DIR:-/app/shared/soundfonts}
      JEONGGANBO_DEVICE: cpu
      MODEL_LOAD_TIMEOUT_SECONDS: ${MODEL_LOAD_TIMEOUT_SECONDS:-120}
      RENDER_TIMEOUT_SECONDS: ${RENDER_TIMEOUT_SECONDS:-120}
      FILE_TOKEN_TTL_SECONDS: ${FILE_TOKEN_TTL_SECONDS:-900}
      FILE_TOKEN_SECRET: ${FILE_TOKEN_SECRET:-}
      BUSY_RETRY_AFTER_SECONDS: ${BUSY_RETRY_AFTER_SECONDS:-5}
      UPLOAD_READ_TIMEOUT_SECONDS: ${UPLOAD_READ_TIMEOUT_SECONDS:-300}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-220200960}
      RECOGNITION_TIMEOUT_MAX_SECONDS: ${RECOGNITION_TIMEOUT_MAX_SECONDS:-180}
      PURGE_INTERVAL_SECONDS: ${PURGE_INTERVAL_SECONDS:-600}
      ORPHAN_RETENTION_HOURS: ${ORPHAN_RETENTION_HOURS:-24}
      STORAGE_DIR: /storage
      SHARED_SCORES_DIR: /shared-scores
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777
    volumes:
      - *engine-volume
      - model-storage:/storage
      # #93: backend가 작성한 공유 악보를 읽는다. API는 shared/<번호>/score.musicxml만 허용한다.
      - storage:/shared-scores:ro
      - type: bind
        source: ../../shared/soundfonts
        target: /app/shared/soundfonts
        read_only: true
        bind:
          create_host_path: false

  demo:
    profiles: [demo]
    build:
      context: ./demo
    image: ${DEMO_IMAGE:-klassic/api-demo:0.2.2}
    init: true
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      DEMO_API_BASE: ${DEMO_API_BASE:-http://model-api:9543}
      DEMO_API_KEY: ${DEMO_API_KEY:-}
      DEMO_PORT: "26102"
    expose: ["26102"]
    depends_on:
      model-api: {condition: service_healthy}

  shared-seed:
    profiles: [tools]
    image: ${MODEL_API_IMAGE:-klassic/model-api:0.2.2}
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: [python, -m, app.tools.seed_shared_examples]
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:?DB_NAME 이 필요합니다}
      DB_USER: ${DB_USER:?DB_USER 가 필요합니다}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 가 필요합니다}
      SHARED_SCORES_DIR: /shared-scores
    volumes:
      - storage:/shared-scores
    depends_on:
      db: {condition: service_healthy}

  engine-selftest:
    <<: *engine-runtime
    profiles: [tools]
    # 기존 Linux model-api 런타임을 검사에만 사용한다. 로컬 빌드/보유가 선행돼야 한다.
    image: ${ENGINE_CHECK_IMAGE:-klassic/klassic-model-api:0.1.1}
    pull_policy: never
    user: "1000:1000"
    environment:
      <<: *engine-environment
      PYTHONPATH: /app/model-api
    entrypoint: [python, -B, /checks/engine_selftest.py]
    command: []
    healthcheck:
      disable: true
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777
    volumes:
      - *engine-volume
      - type: bind
        source: ./scripts/engine_selftest.py
        target: /checks/engine_selftest.py
        read_only: true
        bind:
          create_host_path: false

volumes:
  # backend Compose의 같은 이름·정의와 공유한다(include 병합 시 동일 자원).
  storage:
  model-storage:
  engines:
    # 새 빈 볼륨을 자동 생성하지 않는다. 기존 설치 결과만 읽는다.
    external: true
    name: ${ENGINES_VOLUME_NAME:-klassic_engines}
